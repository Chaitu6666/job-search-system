spring.application.name=message-service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/jobsearch_messageDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000



# ?? Logging ????????????????????????????????????????????????????????
# Root level ? only WARN and above by default
logging.level.root=WARN

# Your application packages ? INFO in dev, change to WARN in prod
logging.level.com.jobsearch=INFO

# Show Hibernate SQL queries ? set to DEBUG to see queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Feign client logs ? shows request/response between services
logging.level.com.jobsearch.job_service.feignclient=DEBUG
logging.level.com.jobsearch.application_service.feignclient=DEBUG
logging.level.com.jobsearch.message_service.feignclient=DEBUG
logging.level.com.jobsearch.jobbasket_service.feignclient=DEBUG

# Log file output ? writes to file as well as console
logging.file.name=logs/jss-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
