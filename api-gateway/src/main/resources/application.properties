spring.application.name=api-gateway
server.port=8080

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=jss_super_secret_key_which_must_be_at_least_256_bits_long_for_hs256

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=job-service
springdoc.swagger-ui.urls[1].url=/job-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=application-service
springdoc.swagger-ui.urls[2].url=/application-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=message-service
springdoc.swagger-ui.urls[3].url=/message-service/v3/api-docs

springdoc.swagger-ui.urls[4].name=jobbasket-service
springdoc.swagger-ui.urls[4].url=/jobbasket-service/v3/api-docs

# Logging
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=TRACE
logging.level.com.jobsearch.api_gateway=DEBUG

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=unrestricted




























